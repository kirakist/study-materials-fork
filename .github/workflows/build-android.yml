name: Build Android APK

# 用法：Actions → Build Android APK → Run workflow。
# 打 v* tag 时也会自动跑，并把 APK 挂到那个 Release 上。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  android:
    name: Android (arm64-v8a / armeabi-v7a / x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 版本号对齐 tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
            V="${V%-android}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu runner 自带 Android SDK，不再用 android-actions/setup-android（它的 license 交互会卡住）
      - name: 准备 Android SDK / NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
          ls "$SDK/ndk"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      - run: pnpm install --frozen-lockfile

      - name: 生成 Android 工程
        run: pnpm tauri android init --ci

      - name: 编译 APK（按 ABI 分包）
        run: pnpm tauri android build --apk --split-per-abi --target aarch64 armv7 x86_64

      - name: 签名 APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            ALIAS="${KEY_ALIAS:?缺少 ANDROID_KEY_ALIAS}"
            SP="${STORE_PASSWORD:?缺少 ANDROID_KEYSTORE_PASSWORD}"
            KP="${KEY_PASSWORD:-$SP}"
            echo "签名：使用仓库 secret 里的固定证书"
          else
            ALIAS="hghub"
            SP="hghub123456"
            KP="hghub123456"
            keytool -genkeypair -v -keystore "$KS" -alias "$ALIAS" -keyalg RSA -keysize 2048 \
              -validity 10950 -storepass "$SP" -keypass "$KP" \
              -dname "CN=HGhub, OU=Personal, O=HGhub, L=Beijing, ST=Beijing, C=CN"
            echo "::warning::没有 ANDROID_KEY_BASE64，本次用一次性自签证书；换证书后的新版需先卸载旧版才能覆盖安装"
          fi
          BT="$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BT/apksigner"
          mkdir -p artifacts
          found=0
          while IFS= read -r f; do
            abi="$(basename "$(dirname "$(dirname "$f")")")"
            case "$abi" in
              arm64) abi="arm64-v8a" ;;
              armv7) abi="armeabi-v7a" ;;
            esac
            out="artifacts/HGhub_${VERSION}_${abi}.apk"
            "$APKSIGNER" sign \
              --ks "$KS" --ks-key-alias "$ALIAS" \
              --ks-pass "pass:$SP" --key-pass "pass:$KP" \
              --v4-signing-enabled false \
              --out "$out" "$f"
            "$APKSIGNER" verify --print-certs "$out" | head -3
            found=$((found+1))
          done < <(find src-tauri/gen/android/app/build/outputs/apk -name '*-release*.apk')
          rm -f "$KS"
          if [ "$found" -eq 0 ]; then echo "::error::没有找到 release APK"; exit 1; fi
          ls -lh artifacts

      - name: 写一份安装说明
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cat > "artifacts/安装说明.txt" <<EOF
          HGhub ${VERSION} Android 版（自编译，非官方发布）
          ================================================

          装哪个文件？
            HGhub_${VERSION}_arm64-v8a.apk    ← 绝大多数 2016 年后的安卓手机，装这个
            HGhub_${VERSION}_armeabi-v7a.apk  ← 很老的 32 位手机才用
            HGhub_${VERSION}_x86_64.apk       ← 电脑上的安卓模拟器才用

          怎么装？
            1. 把 apk 传到手机（微信/QQ/数据线/网盘都行）
            2. 点开安装，若提示「禁止安装未知应用」，去设置里给对应的应用开权限
            3. 安装完直接打开即可，不需要账号登录也可以浏览

          要求：Android 7.0 及以上（minSdk 24）。

          注意：
            - 这是非官方自编译包，用的是自签证书，杀毒软件可能提示「未知来源」，属正常现象
            - 本项目为 PolyForm Noncommercial 1.0.0 许可，仅限非商业使用
            - 若以后安装新版提示「签名不一致」，先卸载旧版再装
          EOF
          cat "artifacts/安装说明.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/*
          if-no-files-found: error

      # 只有打 tag 时才发 Release（手动触发只留 Artifact）
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
