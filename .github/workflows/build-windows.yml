name: Build Windows
# 只出 Windows 产物：NSIS 安装包 (setup.exe) + 便携包 (portable.zip)
# 用法：把本文件放到你 fork 的 .github/workflows/ 下 → push → Actions 页点 “Build Windows” → Run workflow
# 跑完在本次 run 的 Artifacts 里下载 `windows`（同样也会自动建一个 Release，挂上这两个文件）
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
env:
  CI: "true"
jobs:
  windows:
    name: Windows (setup + portable)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 版本号对齐（tag 名 -> src-tauri/tauri.conf.json + package.json）
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: 构建（NSIS 安装包）
        run: pnpm tauri build --bundles nsis
      - name: 收集产物（安装包 + 便携包）
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" artifacts/
          $bin = "src-tauri/target/release/huangguo-client.exe"
          if (-not (Test-Path $bin)) {
            $bin = (Get-ChildItem "src-tauri/target/release" -Filter *.exe | Select-Object -First 1).FullName
          }
          Copy-Item $bin "artifacts/HGhub.exe"
          Compress-Archive -Path "artifacts/HGhub.exe" -DestinationPath "artifacts/HGhub_${v}_x64_portable.zip" -Force
          Remove-Item "artifacts/HGhub.exe"
          Get-ChildItem artifacts | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: artifacts/*
          if-no-files-found: error
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          TAG="v${V}-windows"
          NOTES="## HGhub Windows 编译发布版 (v${V})
          - **安装包**：\`HGhub_${V}_x64-setup.exe\`（NSIS，双击安装）
          - **便携包**：\`HGhub_${V}_x64_portable.zip\`（解压即用，免安装）
          运行环境：Windows 10/11 x64，需要 WebView2 Runtime（Win11 自带，Win10 一般已随 Edge 安装）。"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
            gh release edit "$TAG" --title "HGhub v${V} Windows 版" --notes "$NOTES"
          else
            gh release create "$TAG" artifacts/* --title "HGhub v${V} Windows 版" --notes "$NOTES"
          fi
